
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barreiro Mayorista · Pedidos</title>
  <meta name="theme-color" content="#1a3fcc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0}
    ::-webkit-scrollbar{display:none}
    body{overflow-x:hidden;font-family:"Nunito",sans-serif;background:#f0f4ff}
    :root{
      --blue:#1a3fcc;--blue2:#1228a0;--blue3:#0d1f85;
      --red:#e8111a;--red2:#c20e15;
      --gray:#f0f4ff;--card:#ffffff;
      --text:#0f172a;--text2:#475569;--text3:#94a3b8;
      --shadow:0 2px 8px rgba(26,63,204,.1),0 8px 24px rgba(26,63,204,.08);
      --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
    }

    /* Brand header */
    .bg-brand{background:linear-gradient(135deg,var(--blue3) 0%,var(--blue2) 40%,var(--blue) 100%);position:relative;overflow:hidden}
    .bg-brand::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}

    /* Cards */
    .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow-sm)}
    .card-elevated{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

    /* Category pills */
    .cat-pill{padding:8px 16px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;border:none;cursor:pointer;transition:all .18s;letter-spacing:.01em}
    .cat-pill.active{background:var(--blue);color:white;box-shadow:0 4px 12px rgba(26,63,204,.35)}
    .cat-pill.inactive{background:white;color:var(--text2);border:1.5px solid #e2e8f0}
    .cat-pill.inactive:hover{border-color:var(--blue);color:var(--blue)}

    /* Qty buttons */
    .qty-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;border:none;cursor:pointer;transition:transform .1s}
    .qty-btn:active{transform:scale(.9)}
    .qty-minus{background:#f1f5f9;color:var(--text2)}
    .qty-plus{background:var(--blue);color:white;box-shadow:0 4px 10px rgba(26,63,204,.3)}

    /* Buttons */
    .btn-primary{background:var(--blue);color:white;border:none;cursor:pointer;font-weight:800;border-radius:14px;font-family:"Nunito",sans-serif;letter-spacing:.01em;transition:all .15s;box-shadow:0 4px 14px rgba(26,63,204,.3)}
    .btn-primary:hover{background:var(--blue2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,63,204,.4)}
    .btn-primary:active{transform:translateY(0)}
    .btn-primary:disabled{opacity:.5;transform:none;box-shadow:none}
    .btn-wa{background:linear-gradient(135deg,#20c95e,#25D366);color:white;border:none;cursor:pointer;font-weight:800;border-radius:14px;font-family:"Nunito",sans-serif;transition:all .15s;box-shadow:0 4px 14px rgba(37,211,102,.35)}
    .btn-wa:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,211,102,.45)}
    .btn-wa:active{transform:translateY(0)}
    .btn-wa:disabled{opacity:.5}

    /* Bottom nav */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:none;display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -4px 20px rgba(0,0,0,.08)}
    .nav-btn{flex:1;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;border:none;background:transparent;cursor:pointer;letter-spacing:.03em;text-transform:uppercase;transition:color .15s}
    .nav-btn.active{color:var(--blue)}
    .nav-btn.inactive{color:var(--text3)}

    /* Status badges */
    .badge-pendiente{background:#fef9c3;color:#854d0e;font-weight:800}
    .badge-confirmado{background:#dbeafe;color:#1e40af;font-weight:800}
    .badge-entregado{background:#dcfce7;color:#166534;font-weight:800}
    .badge-cancelado{background:#fee2e2;color:#991b1b;font-weight:800}

    /* Animations */
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .28s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .fade-in{animation:fadeIn .2s ease both}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

    /* Toast */
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:11px 22px;border-radius:999px;font-size:13px;font-weight:700;z-index:100;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1)}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(10,15,40,.75);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
    .modal-box{background:white;border-radius:28px 28px 0 0;width:100%;max-width:480px;overflow:hidden;max-height:92vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.34,1.2,.64,1) both}
    @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}

    /* Product grid cards */
    .product-card{background:white;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .product-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(26,63,204,.15)}
    .product-card:active{transform:translateY(-1px)}

    /* Price tag */
    .price-tag{font-family:"Barlow Condensed",sans-serif;font-weight:800;color:var(--blue);letter-spacing:-.01em}

    /* Section title */
    .section-title{font-family:"Barlow Condensed",sans-serif;font-weight:900;letter-spacing:.02em;text-transform:uppercase}

    /* Input */
    .input-field{width:100%;border:2px solid #e2e8f0;border-radius:12px;padding:12px 14px;font-size:14px;font-family:"Nunito",sans-serif;font-weight:600;outline:none;transition:border-color .15s;background:white}
    .input-field:focus{border-color:var(--blue)}

    /* Search */
    .search-wrap{position:relative}
    .search-wrap input{width:100%;border:2px solid #e8ecf8;border-radius:14px;padding:11px 14px 11px 42px;font-size:14px;font-family:"Nunito",sans-serif;font-weight:600;outline:none;background:white;transition:border-color .15s;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .search-wrap input:focus{border-color:var(--blue)}
    .search-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text3)}

    /* Cart badge */
    .cart-badge{background:var(--red);color:white;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 5px}
  </style>
</head>

      const h=e=>{if(e.key==="Escape")onClose()}
      window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)

    const unitPrice = product.price
    const bulkPrice = unitPrice * uxb
    const subtotal = unitPrice * finalQty

      if(hasVariants && !selectedVariant) return

        ? {...product, selectedVariant: selectedVariant.label, selectedSku: selectedVariant.sku,

        : {...product, cartKey: product.id}

  // ── WHATSAPP SENDER ───────────────────────────────────────
  function sendToWhatsApp(cartItems, cartTotal, clientName, vendorName, notes, profile) {
    const lines = ["🛒 *NUEVO PEDIDO - BARREIRO MAYORISTA*", ""]
    if(clientName) lines.push("👤 *Cliente:* "+clientName)
    if(profile?.nombre_fantasia) lines.push("🏪 *Comercio:* "+profile.nombre_fantasia)
    if(profile?.dni_cuit) lines.push("📋 *DNI/CUIT:* "+profile.dni_cuit)
    if(profile?.domicilio) lines.push("📍 *Entrega:* "+profile.domicilio)
    if(profile?.horarios_entrega) lines.push("🕐 *Horarios:* "+profile.horarios_entrega)
    if(profile?.telefono) lines.push("📞 *Tel:* "+profile.telefono)
    if(vendorName) lines.push("🧑‍💼 *Vendedor:* "+vendorName)
    lines.push("")
    lines.push("*PRODUCTOS:*")
    cartItems.forEach(({product,qty})=>{
      const variantLine = product.selectedVariant ? " ["+product.selectedVariant+"]" : ""
      lines.push("• "+product.name+variantLine)
      lines.push("  Cant: "+qty+" | "+fmt(product.price)+" c/u = *"+fmt(product.price*qty)+"*")
    })
    lines.push("")
    lines.push("💰 *TOTAL: "+fmt(cartTotal)+"*")
    if(notes) lines.push("📝 Obs: "+notes)
    lines.push("")
    lines.push("_Enviado desde la app de pedidos_")
    const msg = encodeURIComponent(lines.join("\n"))
    window.open("https://wa.me/"+WA_NUMBER+"?text="+msg,"_blank")
  }

  function ProductCatalog({clientId,vendorId,clientName,vendorName,onSuccess,profile,onSignOut}) {
    const [products,setProducts]   = useState([])
    const [cart,setCart]           = useState({})
    const [search,setSearch]       = useState("")
    const [cat,setCat]             = useState("TODOS")
    const [view,setView]           = useState("catalog")
    const [notes,setNotes]         = useState("")
    const [loading,setLoading]     = useState(true)
    const [submitting,setSubmitting] = useState(false)
    const [toast,setToast]         = useState("")
    const [modal,setModal]         = useState(null)

    // Persist cart in sessionStorage so it survives tab changes
    useEffect(()=>{
      const saved = sessionStorage.getItem("cart_"+clientId)
      if(saved) try{setCart(JSON.parse(saved))}catch(e){}
    },[clientId])
    useEffect(()=>{
      sessionStorage.setItem("cart_"+clientId, JSON.stringify(cart))
    },[cart,clientId])

    useEffect(()=>{
      sb.from("products").select("*").eq("active",true).order("name")
        .then(({data})=>{setProducts(data||[]);setLoading(false)})
    },[])

    const allCats = useMemo(()=>[...new Set(products.map(p=>p.category))].sort(),[products])
    const filtered = useMemo(()=>
      products.filter(p=>
        (cat==="TODOS"||p.category===cat)&&
        (!search||p.name.toLowerCase().includes(search.toLowerCase())||p.sku.toLowerCase().includes(search.toLowerCase()))
      ),[products,cat,search])

    const cartItems  = Object.values(cart)
    const cartCount  = cartItems.reduce((s,i)=>s+i.qty,0)
    const cartTotal  = cartItems.reduce((s,i)=>s+i.product.price*i.qty,0)

    const addToCart=(p,qty=1)=>{
      const key = p.cartKey || p.id
      setCart(prev=>({...prev,[key]:{product:p,qty}}))
      const label = p.selectedVariant ? p.name.split(" ").slice(0,3).join(" ")+" ("+p.selectedVariant+")" : p.name.split(" ").slice(0,4).join(" ")
      setToast(label+" agregado ✓")
    }
    const updateQty=(id,qty)=>setCart(prev=>{
      if(qty<=0){const n={...prev};delete n[id];return n}
      return{...prev,[id]:{...prev[id],qty}}
    })

    const submit=async()=>{
      if(!cartItems.length)return
      setSubmitting(true)
      const {data:order,error}=await sb.from("orders").insert({
        client_id:clientId,vendor_id:vendorId||null,
        status:"pendiente",total:cartTotal,notes:notes||null
      }).select().single()
      if(error){setSubmitting(false);alert("Error al enviar.");return}
      await sb.from("order_items").insert(
        cartItems.map(i=>({order_id:order.id,product_id:i.product.id,quantity:i.qty,unit_price:i.product.price,subtotal:i.product.price*i.qty}))
      )
      // Send WhatsApp
      sendToWhatsApp(cartItems,cartTotal,clientName,vendorName,notes,profile)
      // Clear cart
      setCart({})
      sessionStorage.removeItem("cart_"+clientId)
      setNotes("")
      setSubmitting(false)
      setView("done")
    }

    if(loading)return React.createElement(Spinner)

    // DONE
    if(view==="done")return React.createElement("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center",background:"#f4f6fb"}},
      React.createElement("div",{className:"fade-up",style:{display:"flex",flexDirection:"column",alignItems:"center"}},
        React.createElement("div",{style:{width:80,height:80,background:"#dcfce7",borderRadius:24,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:20,fontSize:40}},"✅"),
        React.createElement("h2",{style:{fontWeight:"800",fontSize:"22px",color:"#1e293b",marginBottom:8}},"¡Pedido confirmado!"),
        React.createElement("p",{style:{color:"#64748b",fontSize:"14px",maxWidth:280,lineHeight:1.5,marginBottom:8}},"El pedido fue enviado a Barreiro Mayorista por WhatsApp."),
        React.createElement("p",{style:{color:"#94a3b8",fontSize:"12px",marginBottom:28}},"Total: "+fmt(cartTotal)),
        React.createElement("button",{onClick:()=>{setView("catalog");if(onSuccess)onSuccess()},className:"btn-primary",style:{padding:"13px 28px",fontSize:"15px"}},"Hacer otro pedido")
      )
    )

    // CARRITO
    if(view==="cart")return React.createElement("div",{style:{minHeight:"100vh",background:"#f4f6fb",display:"flex",flexDirection:"column"}},
      React.createElement("div",{className:"bg-brand",style:{padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexShrink:0}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10}},
          React.createElement("button",{onClick:()=>setView("catalog"),style:{background:"rgba(255,255,255,.18)",border:"none",color:"white",borderRadius:9,width:36,height:36,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}},"←"),
          React.createElement("div",null,
            React.createElement("p",{style:{fontWeight:"800",fontSize:"16px",color:"white"}},"Tu carrito"),
            React.createElement("p",{style:{fontSize:"12px",color:"rgba(255,255,255,.7)"}},cartCount+" productos · "+fmt(cartTotal))
          )
        ),
        cartItems.length>0&&React.createElement("button",{
          onClick:()=>{if(window.confirm("¿Vaciar el carrito?"))setCart({})},
          style:{background:"rgba(255,255,255,.18)",border:"none",color:"white",borderRadius:9,padding:"7px 12px",fontSize:"12px",fontWeight:"700",cursor:"pointer",display:"flex",alignItems:"center",gap:4}
        },
          React.createElement("span",null,"🗑️"),
          React.createElement("span",null,"Vaciar")
        )
      ),
      React.createElement("div",{style:{flex:1,overflowY:"auto",padding:"12px",paddingBottom:240,display:"flex",flexDirection:"column",gap:8}},
        cartItems.length===0
          ?React.createElement("div",{style:{textAlign:"center",color:"#94a3b8",paddingTop:80}},
              React.createElement("div",{style:{fontSize:52,marginBottom:12}},"🛒"),
              React.createElement("p",null,"El carrito está vacío")
            )
          :cartItems.map(({product,qty})=>
              React.createElement("div",{key:product.id,className:"card",style:{padding:"12px 14px"}},
                React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10}},
                  React.createElement(ProductImg,{sku:product.sku,size:56,radius:11}),
                  React.createElement("div",{style:{flex:1,minWidth:0}},
                    React.createElement("p",{style:{fontWeight:"600",fontSize:"13px",color:"#1e293b",lineHeight:1.3}},product.name),
                    product.selectedVariant && React.createElement("p",{style:{fontSize:"11px",color:"#1a3fcc",fontWeight:"700",marginTop:2}},"🌸 "+product.selectedVariant),
                    React.createElement("p",{style:{fontSize:"11px",color:"#94a3b8",marginTop:1}},CATS[product.category]||product.category)
                  )
                ),
                React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:10}},
                  React.createElement("div",null,
                    React.createElement("p",{style:{fontSize:"11px",color:"#94a3b8"}},fmt(product.price)+" c/u"),
                    React.createElement("p",{style:{fontWeight:"800",fontSize:"17px",color:"#1a3fcc"}},fmt(product.price*qty))
                  ),
                  React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8}},
                    React.createElement("button",{
                      onClick:()=>updateQty(product.cartKey||product.id,0),
                      style:{width:30,height:30,borderRadius:9,background:"#fee2e2",color:"#e8111a",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:"700",flexShrink:0}
                    },"🗑️"),
                    React.createElement("button",{onClick:()=>updateQty(product.cartKey||product.id,qty-1),className:"qty-btn qty-minus",style:{width:30,height:30}},"−"),
                    React.createElement("span",{style:{fontWeight:"700",width:22,textAlign:"center",fontSize:"15px"}},qty),
                    React.createElement("button",{onClick:()=>updateQty(product.cartKey||product.id,qty+1),className:"qty-btn qty-plus",style:{width:30,height:30}},"+")
                  )
                )
              )
            )
      ),
      cartItems.length>0&&React.createElement("div",{style:{position:"fixed",bottom:0,left:0,right:0,background:"white",borderTop:"1.5px solid #e8ecf8",padding:"12px 16px 16px",boxShadow:"0 -4px 20px rgba(0,0,0,.15)",zIndex:40}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:10}},
          React.createElement("div",null,
            React.createElement("p",{style:{fontSize:"11px",color:"#94a3b8"}},cartCount+" productos"),
            React.createElement("p",{style:{fontWeight:"800",fontSize:"20px",color:"#1e293b"}},fmt(cartTotal))
          ),
          React.createElement("textarea",{value:notes,onChange:e=>setNotes(e.target.value),placeholder:"Observaciones...",rows:2,style:{flex:1,border:"1.5px solid #e2e8f0",borderRadius:11,padding:"8px 10px",fontSize:"12px",resize:"none",outline:"none",marginLeft:8}})
        ),
        React.createElement("button",{
          onClick:submit,disabled:submitting,
          style:{width:"100%",padding:"14px",fontSize:"15px",fontWeight:"800",borderRadius:13,border:"none",cursor:"pointer",background:"#25D366",color:"white",display:"flex",alignItems:"center",justifyContent:"center",gap:8,boxShadow:"0 4px 12px rgba(37,211,102,.4)"}
        },
          React.createElement("span",{style:{fontSize:20}},"📲"),
          React.createElement("span",null,submitting?"Enviando...":"Confirmar y enviar por WhatsApp")
        )
      )
    )

    // CATÁLOGO
    return React.createElement("div",{style:{minHeight:"100vh",background:"#f4f6fb"}},
      modal&&React.createElement(ProductModal,{
        product:modal,cartQty:cart[modal.id]?.qty||0,
        onClose:()=>setModal(null),onAdd:addToCart,onUpdate:updateQty
      }),
      React.createElement("div",{style:{position:"sticky",top:0,zIndex:20,background:"white",boxShadow:"0 1px 0 #e8ecf8"}},
        React.createElement("div",{className:"bg-brand",style:{padding:"12px 14px 14px"}},
          // Top row: logo + buttons
          React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
            React.createElement(LogoSmall,{white:true}),
            React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8}},
              cartCount>0&&React.createElement("button",{
                onClick:()=>setView("cart"),
                style:{background:"var(--red)",color:"white",border:"none",borderRadius:12,padding:"8px 13px",fontWeight:"800",fontSize:"13px",cursor:"pointer",display:"flex",alignItems:"center",gap:6,boxShadow:"0 4px 14px rgba(232,17,26,.4)",fontFamily:'"Nunito",sans-serif'}
              },
                React.createElement("span",null,"🛒"),
                React.createElement("span",null,cartCount+" · "+fmt(cartTotal))
              ),
              onSignOut&&React.createElement("button",{onClick:onSignOut,style:{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",color:"white",borderRadius:9,padding:"7px 11px",fontSize:"12px",fontWeight:"700",cursor:"pointer"}},"Salir")
            )
          ),
          // Slogan
          React.createElement("p",{style:{color:"rgba(255,255,255,.5)",fontSize:"10px",fontWeight:"800",textTransform:"uppercase",letterSpacing:".15em",marginBottom:8}},"⭐ Comprá al mejor precio mayorista"),
          // Client info
          profile && React.createElement("div",{style:{background:"rgba(255,255,255,.1)",borderRadius:12,padding:"10px 12px",display:"flex",flexDirection:"column",gap:3}},
            React.createElement("div",{style:{display:"flex",alignItems:"center",gap:6}},
              React.createElement("span",{style:{fontSize:13}},"👤"),
              React.createElement("p",{style:{color:"white",fontWeight:"800",fontSize:"13px"}},(profile.nombre_fantasia||profile.name)||clientName)
            ),
            profile.domicilio&&React.createElement("div",{style:{display:"flex",alignItems:"center",gap:6}},
              React.createElement("span",{style:{fontSize:12}},"📍"),
              React.createElement("p",{style:{color:"rgba(255,255,255,.8)",fontSize:"11px",fontWeight:"600"}},profile.domicilio)
            ),
            profile.telefono&&React.createElement("div",{style:{display:"flex",alignItems:"center",gap:6}},
              React.createElement("span",{style:{fontSize:12}},"📞"),
              React.createElement("p",{style:{color:"rgba(255,255,255,.8)",fontSize:"11px",fontWeight:"600"}},profile.telefono)
            )
          )
        ),
        React.createElement("div",{style:{padding:"10px 13px 6px"}},
          React.createElement("div",{className:"search-wrap"},
            React.createElement("span",{className:"icon"},"🔍"),
            React.createElement("input",{type:"search",value:search,onChange:e=>setSearch(e.target.value),placeholder:"Buscar producto o código..."})
          )
        ),
        React.createElement("div",{style:{padding:"10px 12px 12px"}},
          // "Todos" pill on top
          React.createElement("button",{
            onClick:()=>setCat("TODOS"),
            style:{
              width:"100%",padding:"8px",borderRadius:12,marginBottom:8,fontSize:"13px",fontWeight:"800",
              border:"none",cursor:"pointer",fontFamily:'"Nunito",sans-serif',letterSpacing:".02em",
              background:cat==="TODOS"?"var(--blue)":"#eef1fa",
              color:cat==="TODOS"?"white":"var(--text2)",
              boxShadow:cat==="TODOS"?"0 4px 12px rgba(26,63,204,.3)":"none"
            }
          },"Todos los productos"),
          // Category grid 3 columns
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}},
            allCats.map(c=>{
              const isActive = cat===c
              return React.createElement("button",{
                key:c,
                onClick:()=>setCat(c),
                style:{
                  padding:"10px 6px",borderRadius:14,fontSize:"11px",fontWeight:"800",
                  border:isActive?"2px solid var(--blue)":"2px solid #e8ecf8",
                  cursor:"pointer",fontFamily:'"Nunito",sans-serif',letterSpacing:".01em",
                  background:isActive?"var(--blue)":"white",
                  color:isActive?"white":"var(--text2)",
                  display:"flex",flexDirection:"column",alignItems:"center",gap:6,
                  boxShadow:isActive?"0 4px 12px rgba(26,63,204,.3)":"0 1px 4px rgba(0,0,0,.05)",
                  transition:"all .15s",
                  textAlign:"center",lineHeight:1.2
                }
              },
                React.createElement(CatIcon,{cat:c,size:32,color:isActive?"white":"#1a3fcc"}),
                React.createElement("span",null,CATS[c]||c)
              )
            })
          )
        )
      ),
      React.createElement("div",{style:{padding:"12px 12px 100px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        filtered.length===0
          ?React.createElement("div",{style:{textAlign:"center",color:"#94a3b8",paddingTop:80,gridColumn:"1/-1"}},
              React.createElement("div",{style:{fontSize:44,marginBottom:12}},"😕"),
              React.createElement("p",null,"No encontramos ese producto")
            )
          :filtered.map(p=>{
              const inCart=cart[p.id]
              return React.createElement("div",{
                key:p.id,className:"card fade-up",
                style:{padding:0,overflow:"hidden",display:"flex",flexDirection:"column",cursor:"pointer"},
                onClick:()=>setModal(p)
              },
                React.createElement("div",{style:{position:"relative",background:"linear-gradient(135deg,#f0f4ff,#e8eeff)",padding:"16px",display:"flex",alignItems:"center",justifyContent:"center",minHeight:140}},
                  React.createElement(ProductImg,{sku:p.sku,size:108,radius:12}),
                  inCart&&React.createElement("div",{className:"cart-badge",style:{position:"absolute",top:10,right:10}},inCart.qty)
                ),
                React.createElement("div",{style:{padding:"10px 12px 14px",flex:1,display:"flex",flexDirection:"column"}},
                  React.createElement("div",{style:{display:"flex",alignItems:"center",gap:4,marginBottom:4}},
                    React.createElement(CatIcon,{cat:p.category,size:14,color:"#94a3b8"}),
                    React.createElement("p",{style:{fontSize:"10px",color:"var(--text3)",fontWeight:"800",textTransform:"uppercase",letterSpacing:".06em"}},CATS[p.category]||p.category)
                  ),
                  React.createElement("p",{style:{fontWeight:"700",fontSize:"12px",color:"var(--text)",lineHeight:1.35,flex:1,marginBottom:8}},p.name),
                  React.createElement("p",{className:"price-tag",style:{fontSize:"19px",marginBottom:10}},fmt(p.price)),
                  React.createElement("button",{
                    onClick:e=>{e.stopPropagation();setModal(p)},
                    style:{width:"100%",padding:"9px",borderRadius:11,fontSize:"12px",fontWeight:"800",border:"none",cursor:"pointer",
                      background:inCart?"#dcfce7":"var(--blue)",
                      color:inCart?"#166534":"white",
                      boxShadow:inCart?"none":"0 4px 12px rgba(26,63,204,.25)",
                      fontFamily:'"Nunito",sans-serif',
                      letterSpacing:".01em"
                    }
                  },inCart?"✓ En carrito ("+inCart.qty+")":"+ Agregar")
                )
              )
            })
      ),
      toast&&React.createElement(Toast,{msg:toast,onClose:()=>setToast("")})
    )
  }

  // ── HISTORIAL ─────────────────────────────────────────────
  function OrderHistory({userId,isAdmin}) {
    const [orders,setOrders]=useState([])
    const [loading,setLoading]=useState(true)
    const [selected,setSelected]=useState(null)
    const [items,setItems]=useState([])
    const [loadingItems,setLoadingItems]=useState(false)

    useEffect(()=>{
      let q=sb.from("orders").select("*, client:profiles!orders_client_id_fkey(name), vendor:profiles!orders_vendor_id_fkey(name)").order("created_at",{ascending:false}).limit(100)
      if(!isAdmin)q=q.eq("client_id",userId)
      q.then(({data})=>{setOrders(data||[]);setLoading(false)})
    },[])

    const openOrder=async o=>{
      setSelected(o);setLoadingItems(true)
      const {data}=await sb.from("order_items").select("*, product:products(name,category,sku)").eq("order_id",o.id)
      setItems(data||[]);setLoadingItems(false)
    }
    const changeStatus=async(id,status)=>{
      await sb.from("orders").update({status}).eq("id",id)
      setOrders(prev=>prev.map(o=>o.id===id?{...o,status}:o))
      if(selected?.id===id)setSelected(prev=>({...prev,status}))
    }
    const bc=s=>({pendiente:"badge-pendiente",confirmado:"badge-confirmado",entregado:"badge-entregado",cancelado:"badge-cancelado"}[s]||"")
    const bs={padding:"3px 11px",borderRadius:999,fontSize:"11px",fontWeight:"700"}

    if(loading)return React.createElement(Spinner)

    if(selected)return React.createElement("div",{style:{minHeight:"100vh",background:"#f4f6fb"}},
      React.createElement("div",{className:"bg-brand",style:{padding:"12px 16px",display:"flex",alignItems:"center",gap:10}},
        React.createElement("button",{onClick:()=>setSelected(null),style:{background:"rgba(255,255,255,.18)",border:"none",color:"white",borderRadius:9,width:34,height:34,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}},"←"),
        React.createElement("div",null,
          React.createElement("p",{style:{fontWeight:"800",fontSize:"15px",color:"white"}},"Pedido #"+selected.id.split("-")[0].toUpperCase()),
          React.createElement("p",{style:{fontSize:"11px",color:"rgba(255,255,255,.7)"}},new Date(selected.created_at).toLocaleString("es-AR",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}))
        )
      ),
      React.createElement("div",{style:{padding:"12px",display:"flex",flexDirection:"column",gap:9}},
        React.createElement("div",{className:"card",style:{padding:"14px"}},
          React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}},
            React.createElement("div",null,
              selected.client?.name&&React.createElement("p",{style:{fontWeight:"700",color:"#1e293b",fontSize:"15px"}},selected.client.name),
              selected.vendor?.name&&React.createElement("p",{style:{fontSize:"12px",color:"#94a3b8",marginTop:2}},"Vendedor: "+selected.vendor.name)
            ),
            React.createElement("span",{className:bc(selected.status),style:bs},selected.status)
          ),
          selected.notes&&React.createElement("p",{style:{fontSize:"13px",color:"#64748b",fontStyle:"italic",marginBottom:6}},'"'+selected.notes+'"'),
          React.createElement("p",{style:{fontWeight:"800",fontSize:"24px",color:"#1a3fcc"}},fmt(selected.total))
        ),
        isAdmin&&React.createElement("div",{className:"card",style:{padding:"14px"}},
          React.createElement("p",{style:{fontWeight:"700",fontSize:"12px",color:"#5a6a8a",marginBottom:9,textTransform:"uppercase",letterSpacing:".06em"}},"Cambiar estado"),
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}},
            ["pendiente","confirmado","entregado","cancelado"].map(s=>
              React.createElement("button",{key:s,onClick:()=>changeStatus(selected.id,s),
                style:{padding:"10px",borderRadius:11,fontSize:"12px",fontWeight:"700",border:"2px solid "+(selected.status===s?"#1a3fcc":"#e2e8f0"),background:selected.status===s?"#1a3fcc":"white",color:selected.status===s?"white":"#5a6a8a",cursor:"pointer",textTransform:"capitalize"}}
              ,s)
            )
          )
        ),
        loadingItems?React.createElement(Spinner):
        items.map(item=>
          React.createElement("div",{key:item.id,className:"card",style:{padding:"11px 13px",display:"flex",alignItems:"center",gap:12}},
            item.product&&React.createElement(ProductImg,{sku:item.product.sku,size:48,radius:10}),
            React.createElement("div",{style:{flex:1,minWidth:0}},
              React.createElement("p",{style:{fontWeight:"600",fontSize:"13px",color:"#1e293b",lineHeight:1.3}},item.product?.name),
              React.createElement("p",{style:{fontSize:"12px",color:"#94a3b8",marginTop:2}},fmt(item.unit_price)+" × "+item.quantity)
            ),
            React.createElement("p",{style:{fontWeight:"800",color:"#1a3fcc",fontSize:"15px",flexShrink:0}},fmt(item.subtotal))
          )
        )
      )
    )

    return React.createElement("div",{style:{minHeight:"60vh",background:"#f4f6fb"}},
      React.createElement("div",{className:"bg-brand",style:{padding:"12px 16px"}},
        React.createElement("p",{style:{fontWeight:"800",fontSize:"16px",color:"white"}},isAdmin?"Todos los pedidos":"Mis pedidos")
      ),
      React.createElement("div",{style:{padding:"11px",display:"flex",flexDirection:"column",gap:7,paddingBottom:90}},
        orders.length===0
          ?React.createElement("div",{style:{textAlign:"center",color:"#94a3b8",paddingTop:70}},
              React.createElement("div",{style:{fontSize:44,marginBottom:12}},"📋"),
              React.createElement("p",null,"No hay pedidos todavía")
            )
          :orders.map(o=>
              React.createElement("div",{key:o.id,onClick:()=>openOrder(o),className:"card fade-up",style:{padding:"13px",cursor:"pointer"}},
                React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5}},
                  React.createElement("div",null,
                    React.createElement("p",{style:{fontWeight:"700",fontSize:"14px",color:"#1e293b"}},o.client?.name||"Cliente"),
                    o.vendor?.name&&React.createElement("p",{style:{fontSize:"11px",color:"#94a3b8",marginTop:1}},"Vendedor: "+o.vendor.name)
                  ),
                  React.createElement("span",{className:bc(o.status),style:bs},o.status)
                ),
                React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
                  React.createElement("p",{style:{fontWeight:"800",fontSize:"20px",color:"#1a3fcc"}},fmt(o.total)),
                  React.createElement("p",{style:{fontSize:"11px",color:"#94a3b8"}},new Date(o.created_at).toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"}))
                )
              )
            )
      )

  // ── LOGIN / REGISTRO / RECUPERAR ─────────────────────────
  function LoginPage() {
    const [tab,setTab]     = useState("login") // login | register | recover
    const [email,setEmail] = useState("")
    const [pass,setPass]   = useState("")
    const [pass2,setPass2] = useState("")
    const [loading,setLoading] = useState(false)
    const [error,setError]   = useState("")
    const [success,setSuccess] = useState("")

    // Register form fields
    const [form,setForm] = useState({
      name:"", dni_cuit:"", nombre_fantasia:"",
      domicilio:"", horarios_entrega:"", telefono:""
    })
    const setF = (k,v) => setForm(prev=>({...prev,[k]:v}))

    const inputStyle = {width:"100%",border:"1.5px solid #e2e8f0",borderRadius:11,padding:"11px 13px",fontSize:"14px",outline:"none",boxSizing:"border-box"}
    const labelStyle = {display:"block",fontSize:"11px",fontWeight:"700",color:"#5a6a8a",marginBottom:4,textTransform:"uppercase",letterSpacing:".04em"}

    const switchTab = t => { setTab(t); setError(""); setSuccess("") }

    // LOGIN
    const submitLogin = async e => {
      e.preventDefault(); setLoading(true); setError("")
      const {error} = await sb.auth.signInWithPassword({email,password:pass})
      if(error){setError("Email o contraseña incorrectos.");setLoading(false)}
    }

    // REGISTRO
    const submitRegister = async e => {
      e.preventDefault(); setError(""); setLoading(true)
      if(pass !== pass2){setError("Las contraseñas no coinciden.");setLoading(false);return}
      if(pass.length < 6){setError("La contraseña debe tener al menos 6 caracteres.");setLoading(false);return}
      if(!form.name||!form.domicilio||!form.telefono){setError("Completá los campos obligatorios (*).");setLoading(false);return}

      const {data,error} = await sb.auth.signUp({
        email, password:pass,
        options:{data:{name:form.name, role:"client"}}
      })
      if(error){setError("Error: "+error.message);setLoading(false);return}

      // Save profile data
      if(data?.user){
        await sb.from("profiles").upsert({
          id: data.user.id,
          name: form.name,
          role: "client",
          dni_cuit: form.dni_cuit||null,
          nombre_fantasia: form.nombre_fantasia||null,
          domicilio: form.domicilio,
          horarios_entrega: form.horarios_entrega||null,
          telefono: form.telefono,
          perfil_completo: true
        })
      }
      setLoading(false)
      setSuccess("✅ ¡Cuenta creada! Revisá tu email para confirmar tu cuenta y después podés ingresar.")
    }

    // RECUPERAR CONTRASEÑA
    const submitRecover = async e => {
      e.preventDefault(); setLoading(true); setError(""); setSuccess("")
      const {error} = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      })
      if(error){setError("Error: "+error.message);setLoading(false);return}
      setLoading(false)
      setSuccess("✅ Te enviamos un email para restablecer tu contraseña. Revisá tu bandeja.")

              React.createElement("button",{key:id,onClick:()=>switchTab(id),

            // ── LOGIN ──
            tab==="login" && React.createElement("form",{onSubmit:submitLogin,style:{display:"flex",flexDirection:"column",gap:12}},

              ),
              React.createElement("div",null,
                React.createElement("label",{style:labelStyle},"Contraseña"),
                React.createElement("input",{type:"password",value:pass,onChange:e=>setPass(e.target.value),required:true,placeholder:"••••••••",style:inputStyle})
              ),
              error&&React.createElement("p",{style:{color:"#e8111a",fontSize:"13px",textAlign:"center"}},error),
              React.createElement("button",{type:"submit",disabled:loading,className:"btn-primary",style:{padding:"13px",fontSize:"15px",marginTop:4}},loading?"Ingresando...":"Ingresar"),
              React.createElement("button",{type:"button",onClick:()=>switchTab("recover"),
                style:{background:"none",border:"none",color:"#94a3b8",fontSize:"12px",cursor:"pointer",marginTop:4,textDecoration:"underline"}
              },"¿Olvidaste tu contraseña?")
            ),

            // ── REGISTRO ──
            tab==="register" && (success
              ? React.createElement("div",{style:{textAlign:"center",padding:"20px 0"}},
                  React.createElement("div",{style:{fontSize:48,marginBottom:12}},"📧"),
                  React.createElement("p",{style:{color:"#166534",fontWeight:"700",fontSize:"14px",lineHeight:1.5}},success),
                  React.createElement("button",{onClick:()=>switchTab("login"),className:"btn-primary",style:{padding:"11px 20px",fontSize:"13px",marginTop:16}},"Ir a ingresar")
                )
              : React.createElement("form",{onSubmit:submitRegister,style:{display:"flex",flexDirection:"column",gap:11}},
                  React.createElement("p",{style:{fontSize:"12px",color:"#94a3b8",marginBottom:4}},"Los campos con * son obligatorios"),

                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"Nombre completo *"),
                    React.createElement("input",{type:"text",value:form.name,onChange:e=>setF("name",e.target.value),placeholder:"Tu nombre y apellido",required:true,style:inputStyle})
                  ),
                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"DNI o CUIT (opcional)"),
                    React.createElement("input",{type:"text",value:form.dni_cuit,onChange:e=>setF("dni_cuit",e.target.value),placeholder:"Ej: 20-12345678-9",style:inputStyle})
                  ),
                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"Nombre de fantasía del comercio"),
                    React.createElement("input",{type:"text",value:form.nombre_fantasia,onChange:e=>setF("nombre_fantasia",e.target.value),placeholder:"Ej: Almacén El Ángel",style:inputStyle})
                  ),
                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"Domicilio de entrega *"),
                    React.createElement("input",{type:"text",value:form.domicilio,onChange:e=>setF("domicilio",e.target.value),placeholder:"Calle, número, localidad",required:true,style:inputStyle})
                  ),
                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"Horarios de entrega"),
                    React.createElement("input",{type:"text",value:form.horarios_entrega,onChange:e=>setF("horarios_entrega",e.target.value),placeholder:"Ej: Lun a Vie 9 a 17hs",style:inputStyle})
                  ),
                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"Teléfono de contacto *"),
                    React.createElement("input",{type:"tel",value:form.telefono,onChange:e=>setF("telefono",e.target.value),placeholder:"Ej: 11 1234-5678",required:true,style:inputStyle})
                  ),

                  React.createElement("div",{style:{height:1,background:"#e8ecf8",margin:"4px 0"}}),

                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"Email *"),
                    React.createElement("input",{type:"email",value:email,onChange:e=>setEmail(e.target.value),required:true,placeholder:"tu@email.com",style:inputStyle})
                  ),
                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"Contraseña * (mín. 6 caracteres)"),
                    React.createElement("input",{type:"password",value:pass,onChange:e=>setPass(e.target.value),required:true,placeholder:"••••••••",style:inputStyle})
                  ),
                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"Repetir contraseña *"),
                    React.createElement("input",{type:"password",value:pass2,onChange:e=>setPass2(e.target.value),required:true,placeholder:"••••••••",style:inputStyle})
                  ),

                  error&&React.createElement("p",{style:{color:"#e8111a",fontSize:"13px",textAlign:"center"}},error),
                  React.createElement("button",{type:"submit",disabled:loading,className:"btn-primary",style:{padding:"13px",fontSize:"15px",marginTop:4}},loading?"Creando cuenta...":"Crear cuenta")
                )
            ),

            // ── RECUPERAR ──
            tab==="recover" && (success
              ? React.createElement("div",{style:{textAlign:"center",padding:"20px 0"}},
                  React.createElement("div",{style:{fontSize:48,marginBottom:12}},"📧"),
                  React.createElement("p",{style:{color:"#166534",fontWeight:"700",fontSize:"14px",lineHeight:1.5}},success),
                  React.createElement("button",{onClick:()=>switchTab("login"),className:"btn-primary",style:{padding:"11px 20px",fontSize:"13px",marginTop:16}},"Volver a ingresar")
                )
              : React.createElement("form",{onSubmit:submitRecover,style:{display:"flex",flexDirection:"column",gap:12}},
                  React.createElement("p",{style:{fontSize:"13px",color:"#64748b",marginBottom:4}},"Ingresá tu email y te enviamos un link para restablecer tu contraseña."),
                  React.createElement("div",null,
                    React.createElement("label",{style:labelStyle},"Email"),
                    React.createElement("input",{type:"email",value:email,onChange:e=>setEmail(e.target.value),required:true,placeholder:"tu@email.com",style:inputStyle})
                  ),
                  error&&React.createElement("p",{style:{color:"#e8111a",fontSize:"13px",textAlign:"center"}},error),
                  React.createElement("button",{type:"submit",disabled:loading,className:"btn-primary",style:{padding:"13px",fontSize:"15px"}},loading?"Enviando...":"Enviar email"),
                  React.createElement("button",{type:"button",onClick:()=>switchTab("login"),
                    style:{background:"none",border:"none",color:"#94a3b8",fontSize:"12px",cursor:"pointer",marginTop:4,textDecoration:"underline"}
                  },"← Volver a ingresar")
                )
            )
          )
        )
      ),
      React.createElement("div",{style:{padding:"16px",textAlign:"center"}},
        React.createElement("p",{style:{color:"rgba(255,255,255,.35)",fontSize:"11px",fontWeight:"600",letterSpacing:".05em"}},"BARREIRO MAYORISTA · La Plata")
      )
    )
  }

  // ── ROOT ──────────────────────────────────────────────────
  function App() {
    const [session,setSession]=useState(undefined)
    const [profile,setProfile]=useState(null)
    const loadProfile=async uid=>{
      const {data}=await sb.from("profiles").select("*").eq("id",uid).single()
      setProfile(data)
    }
    useEffect(()=>{
      sb.auth.getSession().then(({data:{session}})=>{setSession(session);if(session)loadProfile(session.user.id)})
      sb.auth.onAuthStateChange((_,s)=>{setSession(s);if(s)loadProfile(s.user.id);else{setSession(null);setProfile(null)}})
    },[])
    if(session===undefined)return React.createElement("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"linear-gradient(160deg,#1535b0,#1a3fcc)"}},
      React.createElement("div",{style:{marginBottom:20}},React.createElement(LogoBig)),
      React.createElement("p",{style:{color:"rgba(255,255,255,.5)",fontSize:"13px"}},"Cargando...")
    )
    if(!session)return React.createElement(LoginPage)
    if(!profile)return React.createElement(Spinner)
    if(profile.role==="admin")return React.createElement(AdminApp,{profile})
    if(profile.role==="vendor")return React.createElement(VendorApp,{profile})
    return React.createElement(ClientApp,{profile})
  }

  createRoot(document.getElementById("root")).render(React.createElement(App))
</script>
</body>
</html>
