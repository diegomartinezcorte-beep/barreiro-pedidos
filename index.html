<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barreiro Insumos · Pedidos</title>
  <meta name="theme-color" content="#1d4ed8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Barreiro B2B">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
    body { overflow-x: hidden; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
<div id="root"></div>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
  import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18'
  import { createRoot } from 'https://esm.sh/react-dom@18/client'

  // ============================================================
  // ⚙️  CONFIGURACIÓN — Reemplazá con tus datos de Supabase
  //     (los encontrás en Project Settings > API)
  // ============================================================
  const SUPABASE_URL      = 'https://kalicowjjtwpwzzwhhuq.supabase.co'
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthbGljb3dqanR3cHd6endoaHVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzIwNDMsImV4cCI6MjA5NTA0ODA0M30.YAsZghBdhDU9ml-4jkSkJtA90_y7mrWx2C1vVi6hur8'
  // ============================================================

  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const fmt = n => '$ ' + Number(n).toLocaleString('es-AR', { maximumFractionDigits: 0 })

  const CATS = {
    'ARTICULOS DE LIMPIEZA': 'Limpieza',
    'BOLSAS RESID':          'Bolsas',
    'QUIMICOS':              'Químicos',
    'PAPELERIA':             'Papelería',
    'AROMATIZACION':         'Aromatiz.',
    'INSECTICIDAS':          'Insecticidas',
  }
  const ICONS = {
    'ARTICULOS DE LIMPIEZA': '🧹',
    'BOLSAS RESID':          '🗑️',
    'QUIMICOS':              '🧴',
    'PAPELERIA':             '📄',
    'AROMATIZACION':         '🌸',
    'INSECTICIDAS':          '🪲',
  }
  const STATUS_COLOR = {
    pendiente:  'bg-yellow-100 text-yellow-800',
    confirmado: 'bg-blue-100   text-blue-800',
    entregado:  'bg-green-100  text-green-800',
    cancelado:  'bg-red-100    text-red-800',
  }

  // ── UTILIDADES ────────────────────────────────────────────

  function Spinner() {
    return React.createElement('div', { className: 'flex items-center justify-center py-20' },
      React.createElement('div', { className: 'w-10 h-10 border-4 border-blue-700 border-t-transparent rounded-full animate-spin' })
    )
  }

  function Toast({ msg, onClose }) {
    useEffect(() => { const t = setTimeout(onClose, 2200); return () => clearTimeout(t) }, [])
    return React.createElement('div', {
      className: 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-medium z-50 whitespace-nowrap'
    }, msg)
  }

  // ── LOGIN ─────────────────────────────────────────────────

  function LoginPage() {
    const [email, setEmail] = useState('')
    const [pass,  setPass]  = useState('')
    const [loading, setLoading] = useState(false)
    const [error,   setError]   = useState('')

    const submit = async e => {
      e.preventDefault(); setLoading(true); setError('')
      const { error } = await sb.auth.signInWithPassword({ email, password: pass })
      if (error) setError('Email o contraseña incorrectos.')
      setLoading(false)
    }

    return React.createElement('div', { className: 'min-h-screen bg-gradient-to-b from-blue-700 to-blue-900 flex items-center justify-center p-6' },
      React.createElement('div', { className: 'bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl' },
        React.createElement('div', { className: 'text-center mb-8' },
          React.createElement('div', { className: 'w-16 h-16 bg-blue-700 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl' }, '🧹'),
          React.createElement('h1', { className: 'text-2xl font-bold text-gray-900' }, 'Barreiro Insumos'),
          React.createElement('p',  { className: 'text-gray-400 text-sm mt-1' }, 'Portal de pedidos mayoristas')
        ),
        React.createElement('form', { onSubmit: submit, className: 'space-y-4' },
          React.createElement('div', null,
            React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-1' }, 'Email'),
            React.createElement('input', {
              type: 'email', value: email, onChange: e => setEmail(e.target.value),
              required: true, placeholder: 'tu@email.com',
              className: 'w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500'
            })
          ),
          React.createElement('div', null,
            React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-1' }, 'Contraseña'),
            React.createElement('input', {
              type: 'password', value: pass, onChange: e => setPass(e.target.value),
              required: true, placeholder: '••••••••',
              className: 'w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500'
            })
          ),
          error && React.createElement('p', { className: 'text-red-500 text-sm text-center' }, error),
          React.createElement('button', {
            type: 'submit', disabled: loading,
            className: 'w-full bg-blue-700 text-white rounded-xl py-3.5 font-bold text-base hover:bg-blue-800 transition disabled:opacity-60'
          }, loading ? 'Ingresando...' : 'Ingresar')
        ),
        React.createElement('p', { className: 'text-center text-xs text-gray-400 mt-6' }, 'Contactá a Barreiro para obtener tu acceso.')
      )
    )
  }

  // ── CATÁLOGO + CARRITO (cliente y vendedor) ───────────────

  function ProductCatalog({ clientId, vendorId, onSuccess }) {
    const [products, setProducts] = useState([])
    const [cart, setCart] = useState({})
    const [search, setSearch] = useState('')
    const [cat, setCat] = useState('TODOS')
    const [view, setView] = useState('catalog')   // catalog | cart | done
    const [notes, setNotes] = useState('')
    const [loading, setLoading] = useState(true)
    const [submitting, setSubmitting] = useState(false)
    const [toast, setToast] = useState('')

    useEffect(() => {
      sb.from('products').select('*').eq('active', true).order('name').then(({ data }) => {
        setProducts(data || [])
        setLoading(false)
      })
    }, [])

    const filtered = useMemo(() =>
      products.filter(p =>
        (cat === 'TODOS' || p.category === cat) &&
        (!search || p.name.toLowerCase().includes(search.toLowerCase()) || p.sku.toLowerCase().includes(search.toLowerCase()))
      ),
    [products, cat, search])

    const cartItems = Object.values(cart)
    const cartCount = cartItems.reduce((s, i) => s + i.qty, 0)
    const cartTotal = cartItems.reduce((s, i) => s + i.product.price * i.qty, 0)

    const add = p => {
      setCart(prev => ({ ...prev, [p.id]: { product: p, qty: (prev[p.id]?.qty || 0) + 1 } }))
      setToast(p.name.split(' ').slice(0, 3).join(' ') + ' agregado ✓')
    }

    const updQty = (id, d) => setCart(prev => {
      const item = prev[id]; if (!item) return prev
      const qty = item.qty + d
      if (qty <= 0) { const n = { ...prev }; delete n[id]; return n }
      return { ...prev, [id]: { ...item, qty } }
    })

    const submit = async () => {
      if (!cartItems.length) return
      setSubmitting(true)
      const { data: order, error } = await sb.from('orders').insert({
        client_id: clientId, vendor_id: vendorId || null,
        status: 'pendiente', total: cartTotal, notes: notes || null
      }).select().single()
      if (error) { setSubmitting(false); alert('Error al enviar. Intentá de nuevo.'); return }
      await sb.from('order_items').insert(
        cartItems.map(i => ({
          order_id: order.id, product_id: i.product.id,
          quantity: i.qty, unit_price: i.product.price, subtotal: i.product.price * i.qty
        }))
      )
      setCart({}); setNotes(''); setSubmitting(false); setView('done')
    }

    if (loading) return React.createElement(Spinner)

    // ── PEDIDO ENVIADO ────────────────────────────────────────
    if (view === 'done') return React.createElement('div', { className: 'min-h-screen flex flex-col items-center justify-center p-8 text-center bg-gray-50' },
      React.createElement('div', { className: 'text-7xl mb-6' }, '✅'),
      React.createElement('h2', { className: 'text-2xl font-bold text-gray-900 mb-2' }, '¡Pedido enviado!'),
      React.createElement('p', { className: 'text-gray-500 mb-8 text-sm' }, 'Barreiro recibió tu pedido y te contactará a la brevedad.'),
      React.createElement('button', {
        onClick: () => { setView('catalog'); if (onSuccess) onSuccess() },
        className: 'bg-blue-700 text-white px-8 py-3 rounded-2xl font-bold'
      }, 'Hacer otro pedido')
    )

    // ── CARRITO ───────────────────────────────────────────────
    if (view === 'cart') return React.createElement('div', { className: 'min-h-screen bg-gray-50 flex flex-col' },
      React.createElement('div', { className: 'bg-blue-700 text-white p-4 flex items-center gap-3 shrink-0' },
        React.createElement('button', { onClick: () => setView('catalog'), className: 'text-xl font-bold' }, '←'),
        React.createElement('h2', { className: 'text-lg font-bold' }, 'Tu carrito')
      ),
      React.createElement('div', { className: 'flex-1 overflow-y-auto p-4 space-y-3 pb-52' },
        cartItems.length === 0
          ? React.createElement('div', { className: 'text-center text-gray-400 py-16' },
              React.createElement('div', { className: 'text-5xl mb-3' }, '🛒'),
              React.createElement('p', null, 'El carrito está vacío')
            )
          : cartItems.map(({ product, qty }) =>
              React.createElement('div', { key: product.id, className: 'bg-white rounded-2xl p-4 shadow-sm' },
                React.createElement('div', { className: 'flex justify-between items-start mb-3' },
                  React.createElement('div', { className: 'flex-1 pr-2' },
                    React.createElement('p', { className: 'font-semibold text-sm text-gray-900 leading-snug' }, product.name),
                    React.createElement('p', { className: 'text-xs text-gray-400 mt-0.5' }, CATS[product.category] || product.category)
                  ),
                  React.createElement('p', { className: 'font-bold text-blue-700 text-sm shrink-0' }, fmt(product.price * qty))
                ),
                React.createElement('div', { className: 'flex items-center justify-between' },
                  React.createElement('span', { className: 'text-xs text-gray-400' }, fmt(product.price) + ' c/u'),
                  React.createElement('div', { className: 'flex items-center gap-3' },
                    React.createElement('button', { onClick: () => updQty(product.id, -1), className: 'w-9 h-9 bg-gray-100 rounded-full text-lg font-bold flex items-center justify-center' }, '−'),
                    React.createElement('span', { className: 'font-bold w-6 text-center' }, qty),
                    React.createElement('button', { onClick: () => updQty(product.id, 1),  className: 'w-9 h-9 bg-blue-700 text-white rounded-full text-lg font-bold flex items-center justify-center' }, '+')
                  )
                )
              )
            )
      ),
      cartItems.length > 0 && React.createElement('div', { className: 'fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-4 space-y-3 shadow-lg' },
        React.createElement('textarea', {
          value: notes, onChange: e => setNotes(e.target.value),
          placeholder: 'Observaciones del pedido (opcional)...',
          rows: 2,
          className: 'w-full border border-gray-200 rounded-xl px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-500'
        }),
        React.createElement('div', { className: 'flex items-center justify-between gap-3' },
          React.createElement('div', null,
            React.createElement('p', { className: 'text-xs text-gray-400' }, cartCount + ' productos'),
            React.createElement('p', { className: 'text-xl font-bold text-gray-900' }, fmt(cartTotal))
          ),
          React.createElement('button', {
            onClick: submit, disabled: submitting,
            className: 'bg-blue-700 text-white px-6 py-3 rounded-2xl font-bold disabled:opacity-60 flex-shrink-0'
          }, submitting ? 'Enviando...' : 'Confirmar pedido →')
        )
      )
    )

    // ── CATÁLOGO ──────────────────────────────────────────────
    return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
      React.createElement('div', { className: 'sticky top-0 z-10 bg-white shadow-sm' },
        React.createElement('div', { className: 'bg-blue-700 px-4 py-3 flex items-center justify-between' },
          React.createElement('p', { className: 'text-white font-bold' }, 'Catálogo Barreiro'),
          cartCount > 0 && React.createElement('button', {
            onClick: () => setView('cart'),
            className: 'bg-white text-blue-700 px-3 py-1.5 rounded-xl font-bold text-sm'
          }, `🛒 ${cartCount}  ·  ${fmt(cartTotal)}`)
        ),
        React.createElement('div', { className: 'px-4 pt-3 pb-2' },
          React.createElement('input', {
            type: 'search', value: search, onChange: e => setSearch(e.target.value),
            placeholder: '🔍  Buscar producto...',
            className: 'w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500'
          })
        ),
        React.createElement('div', { className: 'flex gap-2 px-4 pb-3 overflow-x-auto' },
          ['TODOS', ...Object.keys(CATS)].map(c =>
            React.createElement('button', {
              key: c, onClick: () => setCat(c),
              className: `shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition ${cat === c ? 'bg-blue-700 text-white' : 'bg-gray-100 text-gray-600'}`
            }, c === 'TODOS' ? 'Todos' : CATS[c])
          )
        )
      ),

      React.createElement('div', { className: 'p-3 space-y-2 pb-6' },
        filtered.length === 0
          ? React.createElement('div', { className: 'text-center text-gray-400 py-16' },
              React.createElement('div', { className: 'text-5xl mb-3' }, '😕'),
              React.createElement('p', null, 'No encontramos productos')
            )
          : filtered.map(p =>
              React.createElement('div', { key: p.id, className: 'bg-white rounded-2xl px-4 py-3 shadow-sm flex items-center gap-3' },
                React.createElement('div', { className: 'w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-xl shrink-0' }, ICONS[p.category] || '📦'),
                React.createElement('div', { className: 'flex-1 min-w-0' },
                  React.createElement('p', { className: 'font-semibold text-sm text-gray-900 leading-snug' }, p.name),
                  React.createElement('p', { className: 'text-xs text-gray-400 mt-0.5' }, CATS[p.category] || p.category),
                  React.createElement('p', { className: 'text-blue-700 font-bold text-base mt-0.5' }, fmt(p.price))
                ),
                cart[p.id]
                  ? React.createElement('div', { className: 'flex items-center gap-2 shrink-0' },
                      React.createElement('button', { onClick: () => updQty(p.id, -1), className: 'w-8 h-8 bg-gray-100 rounded-full text-lg font-bold flex items-center justify-center' }, '−'),
                      React.createElement('span', { className: 'font-bold w-5 text-center text-sm' }, cart[p.id].qty),
                      React.createElement('button', { onClick: () => updQty(p.id,  1), className: 'w-8 h-8 bg-blue-700 text-white rounded-full text-lg font-bold flex items-center justify-center' }, '+')
                    )
                  : React.createElement('button', {
                      onClick: () => add(p),
                      className: 'w-9 h-9 bg-blue-700 text-white rounded-xl text-xl font-bold flex items-center justify-center shrink-0'
                    }, '+')
              )
            )
      ),

      toast && React.createElement(Toast, { msg: toast, onClose: () => setToast('') })
    )
  }

  // ── HISTORIAL DE PEDIDOS ──────────────────────────────────

  function OrderHistory({ userId, isAdmin }) {
    const [orders, setOrders] = useState([])
    const [loading, setLoading] = useState(true)
    const [selected, setSelected] = useState(null)
    const [items, setItems] = useState([])
    const [loadingItems, setLoadingItems] = useState(false)

    useEffect(() => {
      let q = sb.from('orders')
        .select('*, client:profiles!orders_client_id_fkey(name), vendor:profiles!orders_vendor_id_fkey(name)')
        .order('created_at', { ascending: false }).limit(100)
      if (!isAdmin) q = q.eq('client_id', userId)
      q.then(({ data }) => { setOrders(data || []); setLoading(false) })
    }, [])

    const openOrder = async o => {
      setSelected(o); setLoadingItems(true)
      const { data } = await sb.from('order_items').select('*, product:products(name, category)').eq('order_id', o.id)
      setItems(data || []); setLoadingItems(false)
    }

    const changeStatus = async (id, status) => {
      await sb.from('orders').update({ status }).eq('id', id)
      setOrders(prev => prev.map(o => o.id === id ? { ...o, status } : o))
      if (selected?.id === id) setSelected(prev => ({ ...prev, status }))
    }

    if (loading) return React.createElement(Spinner)

    // Detalle de un pedido
    if (selected) return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
      React.createElement('div', { className: 'bg-blue-700 text-white p-4 flex items-center gap-3' },
        React.createElement('button', { onClick: () => setSelected(null), className: 'text-xl font-bold' }, '←'),
        React.createElement('div', null,
          React.createElement('p', { className: 'font-bold' }, `Pedido #${selected.id.split('-')[0].toUpperCase()}`),
          React.createElement('p', { className: 'text-xs opacity-80' }, new Date(selected.created_at).toLocaleString('es-AR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }))
        )
      ),
      React.createElement('div', { className: 'p-4 space-y-3' },
        React.createElement('div', { className: 'bg-white rounded-2xl p-4 shadow-sm' },
          React.createElement('div', { className: 'flex justify-between items-start mb-2' },
            React.createElement('div', null,
              selected.client?.name && React.createElement('p', { className: 'font-bold text-gray-900' }, selected.client.name),
              selected.vendor?.name && React.createElement('p', { className: 'text-xs text-gray-400' }, `Vendedor: ${selected.vendor.name}`)
            ),
            React.createElement('span', { className: `px-3 py-1 rounded-full text-xs font-bold ${STATUS_COLOR[selected.status]}` }, selected.status)
          ),
          selected.notes && React.createElement('p', { className: 'text-sm text-gray-500 italic mt-1' }, `"${selected.notes}"`),
          React.createElement('p', { className: 'text-2xl font-bold text-blue-700 mt-2' }, fmt(selected.total))
        ),

        isAdmin && React.createElement('div', { className: 'bg-white rounded-2xl p-4 shadow-sm' },
          React.createElement('p', { className: 'font-bold text-sm mb-3 text-gray-700' }, 'Cambiar estado'),
          React.createElement('div', { className: 'grid grid-cols-2 gap-2' },
            ['pendiente', 'confirmado', 'entregado', 'cancelado'].map(s =>
              React.createElement('button', {
                key: s, onClick: () => changeStatus(selected.id, s),
                className: `py-2.5 rounded-xl text-xs font-bold capitalize border-2 transition ${selected.status === s ? 'border-blue-700 bg-blue-700 text-white' : 'border-gray-200 text-gray-600'}`
              }, s)
            )
          )
        ),

        loadingItems
          ? React.createElement(Spinner)
          : items.map(item =>
              React.createElement('div', { key: item.id, className: 'bg-white rounded-2xl px-4 py-3 shadow-sm flex justify-between items-center' },
                React.createElement('div', { className: 'flex-1 min-w-0 pr-3' },
                  React.createElement('p', { className: 'font-semibold text-sm leading-snug' }, item.product?.name),
                  React.createElement('p', { className: 'text-xs text-gray-400 mt-0.5' }, `${fmt(item.unit_price)} × ${item.quantity}`)
                ),
                React.createElement('p', { className: 'font-bold text-blue-700 shrink-0' }, fmt(item.subtotal))
              )
            )
      )
    )

    // Lista de pedidos
    return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
      React.createElement('div', { className: 'bg-blue-700 text-white p-4' },
        React.createElement('h2', { className: 'font-bold text-lg' }, isAdmin ? 'Todos los pedidos' : 'Mis pedidos')
      ),
      React.createElement('div', { className: 'p-4 space-y-3 pb-24' },
        orders.length === 0
          ? React.createElement('div', { className: 'text-center text-gray-400 py-16' },
              React.createElement('div', { className: 'text-5xl mb-3' }, '📋'),
              React.createElement('p', null, 'No hay pedidos todavía')
            )
          : orders.map(o =>
              React.createElement('div', {
                key: o.id, onClick: () => openOrder(o),
                className: 'bg-white rounded-2xl p-4 shadow-sm cursor-pointer active:scale-[0.98] transition'
              },
                React.createElement('div', { className: 'flex justify-between items-start' },
                  React.createElement('div', null,
                    React.createElement('p', { className: 'font-bold text-sm text-gray-900' }, o.client?.name || 'Cliente'),
                    o.vendor?.name && React.createElement('p', { className: 'text-xs text-gray-400' }, `Vendedor: ${o.vendor.name}`),
                    React.createElement('p', { className: 'text-xs text-gray-400 mt-0.5' }, new Date(o.created_at).toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' }))
                  ),
                  React.createElement('span', { className: `px-2.5 py-1 rounded-full text-xs font-bold ${STATUS_COLOR[o.status]}` }, o.status)
                ),
                React.createElement('p', { className: 'text-xl font-bold text-blue-700 mt-2' }, fmt(o.total))
              )
            )
      )
    )
  }

  // ── VISTA CLIENTE ─────────────────────────────────────────

  function ClientApp({ profile }) {
    const [tab, setTab] = useState('catalog')

    return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
      React.createElement('div', { className: 'bg-blue-700 text-white px-4 pt-4 pb-3' },
        React.createElement('p', { className: 'font-bold text-lg' }, `Hola, ${profile.name.split(' ')[0]} 👋`),
        React.createElement('p', { className: 'text-xs opacity-75' }, 'Tus precios mayoristas')
      ),
      tab === 'catalog' && React.createElement(ProductCatalog, { clientId: profile.id }),
      tab === 'orders'  && React.createElement(OrderHistory, { userId: profile.id }),

      React.createElement('div', { className: 'fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex z-20' },
        [{ id: 'catalog', icon: '📦', label: 'Catálogo' }, { id: 'orders', icon: '📋', label: 'Mis pedidos' }].map(({ id, icon, label }) =>
          React.createElement('button', {
            key: id, onClick: () => setTab(id),
            className: `flex-1 py-3 flex flex-col items-center gap-0.5 text-xs font-semibold ${tab === id ? 'text-blue-700' : 'text-gray-400'}`
          }, React.createElement('span', { className: 'text-xl' }, icon), label)
        )
      )
    )
  }

  // ── VISTA VENDEDOR ────────────────────────────────────────

  function VendorApp({ profile }) {
    const [clients, setClients]     = useState([])
    const [selected, setSelected]   = useState(null)
    const [loading, setLoading]     = useState(true)
    const [search, setSearch]       = useState('')

    useEffect(() => {
      sb.from('profiles').select('*').eq('role', 'client').order('name').then(({ data }) => {
        setClients(data || []); setLoading(false)
      })
    }, [])

    const filtered = clients.filter(c => c.name.toLowerCase().includes(search.toLowerCase()))

    if (selected) return React.createElement('div', null,
      React.createElement('div', { className: 'bg-blue-800 text-white px-4 py-2.5 flex items-center gap-2' },
        React.createElement('button', { onClick: () => setSelected(null), className: 'text-sm font-bold' }, '← Clientes'),
        React.createElement('span', { className: 'text-sm font-bold opacity-80' }, '·'),
        React.createElement('span', { className: 'text-sm font-bold' }, selected.name)
      ),
      React.createElement(ProductCatalog, { clientId: selected.id, vendorId: profile.id, onSuccess: () => setSelected(null) })
    )

    return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
      React.createElement('div', { className: 'bg-blue-700 text-white p-4' },
        React.createElement('h2', { className: 'font-bold text-lg' }, `Hola, ${profile.name.split(' ')[0]} 👋`),
        React.createElement('p',  { className: 'text-sm opacity-75 mt-0.5' }, 'Seleccioná un cliente para hacer su pedido')
      ),
      React.createElement('div', { className: 'p-4' },
        React.createElement('input', {
          type: 'search', value: search, onChange: e => setSearch(e.target.value),
          placeholder: '🔍  Buscar cliente...',
          className: 'w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm bg-white mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500'
        }),
        loading ? React.createElement(Spinner) :
        React.createElement('div', { className: 'space-y-2' },
          filtered.length === 0 && React.createElement('p', { className: 'text-center text-gray-400 py-8' }, 'No hay clientes'),
          filtered.map(c =>
            React.createElement('button', {
              key: c.id, onClick: () => setSelected(c),
              className: 'w-full bg-white rounded-2xl px-4 py-3.5 shadow-sm flex items-center gap-3 text-left active:scale-[0.98] transition'
            },
              React.createElement('div', { className: 'w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center font-bold text-blue-700 shrink-0 text-base' }, c.name.charAt(0).toUpperCase()),
              React.createElement('div', { className: 'flex-1 min-w-0' },
                React.createElement('p', { className: 'font-semibold text-sm text-gray-900' }, c.name),
                c.phone && React.createElement('p', { className: 'text-xs text-gray-400' }, c.phone)
              ),
              React.createElement('span', { className: 'text-gray-300 text-xl' }, '›')
            )
          )
        )
      )
    )
  }

  // ── VISTA ADMIN ───────────────────────────────────────────

  function AdminApp({ profile }) {
    const [tab, setTab] = useState('orders')
    const [products, setProducts] = useState([])
    const [clients, setClients]   = useState([])
    const [loadP, setLoadP] = useState(true)
    const [loadC, setLoadC] = useState(true)
    const [editing, setEditing]   = useState(null)
    const [newPrice, setNewPrice] = useState('')
    const [newClient, setNewClient] = useState({ name: '', email: '', phone: '' })
    const [saving, setSaving]     = useState(false)
    const [msg, setMsg]           = useState('')

    useEffect(() => {
      sb.from('products').select('*').order('category').order('name').then(({ data }) => { setProducts(data || []); setLoadP(false) })
      sb.from('profiles').select('*').eq('role', 'client').order('name').then(({ data }) => { setClients(data || []); setLoadC(false) })
    }, [])

    const savePrice = async id => {
      const p = parseFloat(newPrice)
      if (!p || p <= 0) { setEditing(null); return }
      await sb.from('products').update({ price: p }).eq('id', id)
      setProducts(prev => prev.map(pr => pr.id === id ? { ...pr, price: p } : pr))
      setEditing(null)
    }

    const toggleActive = async (id, cur) => {
      await sb.from('products').update({ active: !cur }).eq('id', id)
      setProducts(prev => prev.map(pr => pr.id === id ? { ...pr, active: !cur } : pr))
    }

    const addClient = async () => {
      if (!newClient.name || !newClient.email) return
      setSaving(true); setMsg('')
      // Invita al usuario por email (requiere que se active desde su correo)
      const { error } = await sb.auth.signUp({
        email: newClient.email,
        password: Math.random().toString(36).slice(-10) + 'A1!',
        options: { data: { name: newClient.name, role: 'client' } }
      })
      if (error) { setMsg('Error: ' + error.message) }
      else { setMsg('✅ Se envió un email de confirmación a ' + newClient.email); setNewClient({ name: '', email: '', phone: '' }) }
      setSaving(false)
    }

    const signOut = () => sb.auth.signOut().then(() => window.location.reload())

    const CATS_ORDER = ['ARTICULOS DE LIMPIEZA', 'BOLSAS RESID', 'QUIMICOS', 'PAPELERIA', 'AROMATIZACION', 'INSECTICIDAS']

    return React.createElement('div', { className: 'min-h-screen bg-gray-50 pb-20' },
      React.createElement('div', { className: 'bg-blue-700 text-white px-4 py-3 flex justify-between items-center' },
        React.createElement('div', null,
          React.createElement('h2', { className: 'font-bold text-lg' }, 'Panel Admin'),
          React.createElement('p',  { className: 'text-xs opacity-75' }, 'Barreiro Insumos')
        ),
        React.createElement('button', { onClick: signOut, className: 'text-xs bg-white bg-opacity-20 px-3 py-1.5 rounded-lg font-medium' }, 'Salir')
      ),

      React.createElement('div', { className: 'flex bg-white border-b border-gray-200' },
        [{ id: 'orders', label: '📋 Pedidos' }, { id: 'products', label: '📦 Productos' }, { id: 'clients', label: '👥 Clientes' }].map(({ id, label }) =>
          React.createElement('button', {
            key: id, onClick: () => setTab(id),
            className: `flex-1 py-3 text-xs font-bold border-b-2 transition ${tab === id ? 'border-blue-700 text-blue-700' : 'border-transparent text-gray-400'}`
          }, label)
        )
      ),

      tab === 'orders' && React.createElement(OrderHistory, { userId: profile.id, isAdmin: true }),

      tab === 'products' && (loadP ? React.createElement(Spinner) :
        React.createElement('div', { className: 'p-3 pb-6' },
          CATS_ORDER.map(cat =>
            React.createElement('div', { key: cat, className: 'mb-5' },
              React.createElement('p', { className: 'text-xs font-bold text-gray-400 uppercase px-1 mb-2' }, CATS[cat] || cat),
              products.filter(p => p.category === cat).map(p =>
                React.createElement('div', {
                  key: p.id,
                  className: `bg-white rounded-xl px-3 py-2.5 mb-1.5 shadow-sm flex items-center justify-between gap-2 ${!p.active ? 'opacity-40' : ''}`
                },
                  React.createElement('p', { className: 'text-sm font-medium flex-1 min-w-0 truncate pr-2' }, p.name),
                  React.createElement('div', { className: 'flex items-center gap-2 shrink-0' },
                    editing === p.id
                      ? React.createElement('div', { className: 'flex items-center gap-1' },
                          React.createElement('input', {
                            type: 'number', value: newPrice, onChange: e => setNewPrice(e.target.value),
                            className: 'border rounded-lg px-2 py-1 text-sm w-24 focus:outline-none focus:ring-2 focus:ring-blue-500',
                            autoFocus: true
                          }),
                          React.createElement('button', { onClick: () => savePrice(p.id), className: 'bg-blue-700 text-white px-2 py-1 rounded-lg text-xs' }, '✓'),
                          React.createElement('button', { onClick: () => setEditing(null), className: 'bg-gray-200 px-2 py-1 rounded-lg text-xs' }, '✕')
                        )
                      : React.createElement('button', {
                          onClick: () => { setEditing(p.id); setNewPrice(String(p.price)) },
                          className: 'text-blue-700 font-bold text-sm'
                        }, fmt(p.price)),
                    React.createElement('button', {
                      onClick: () => toggleActive(p.id, p.active),
                      className: `text-xs px-2 py-1 rounded-lg font-bold ${p.active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'}`
                    }, p.active ? 'ON' : 'OFF')
                  )
                )
              )
            )
          )
        )
      ),

      tab === 'clients' && (loadC ? React.createElement(Spinner) :
        React.createElement('div', { className: 'p-4' },
          React.createElement('div', { className: 'bg-white rounded-2xl p-4 shadow-sm mb-4' },
            React.createElement('p', { className: 'font-bold mb-3 text-gray-900' }, '+ Agregar cliente'),
            React.createElement('div', { className: 'space-y-2' },
              React.createElement('input', { type: 'text', placeholder: 'Nombre del negocio *', value: newClient.name, onChange: e => setNewClient(p => ({ ...p, name: e.target.value })), className: 'w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500' }),
              React.createElement('input', { type: 'email', placeholder: 'Email *', value: newClient.email, onChange: e => setNewClient(p => ({ ...p, email: e.target.value })), className: 'w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500' }),
              React.createElement('input', { type: 'tel', placeholder: 'Teléfono (opcional)', value: newClient.phone, onChange: e => setNewClient(p => ({ ...p, phone: e.target.value })), className: 'w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500' }),
              React.createElement('button', {
                onClick: addClient, disabled: saving || !newClient.name || !newClient.email,
                className: 'w-full bg-blue-700 text-white py-2.5 rounded-xl font-bold text-sm disabled:opacity-50'
              }, saving ? 'Enviando invitación...' : 'Invitar cliente'),
              msg && React.createElement('p', { className: 'text-sm text-center mt-1' }, msg)
            )
          ),
          React.createElement('div', { className: 'space-y-2' },
            clients.map(c =>
              React.createElement('div', { key: c.id, className: 'bg-white rounded-2xl px-4 py-3 shadow-sm flex items-center gap-3' },
                React.createElement('div', { className: 'w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center font-bold text-blue-700 shrink-0' }, c.name.charAt(0).toUpperCase()),
                React.createElement('div', null,
                  React.createElement('p', { className: 'font-semibold text-sm text-gray-900' }, c.name),
                  c.phone && React.createElement('p', { className: 'text-xs text-gray-400' }, c.phone)
                )
              )
            )
          )
        )
      )
    )
  }

  // ── ROOT APP ──────────────────────────────────────────────

  function App() {
    const [session, setSession] = useState(undefined)
    const [profile, setProfile] = useState(null)

    const loadProfile = async uid => {
      const { data } = await sb.from('profiles').select('*').eq('id', uid).single()
      setProfile(data)
    }

    useEffect(() => {
      sb.auth.getSession().then(({ data: { session } }) => {
        setSession(session)
        if (session) loadProfile(session.user.id)
      })
      sb.auth.onAuthStateChange((_, s) => {
        setSession(s)
        if (s) loadProfile(s.user.id)
        else { setSession(null); setProfile(null) }
      })
    }, [])

    if (session === undefined) return React.createElement('div', { className: 'min-h-screen flex items-center justify-center' },
      React.createElement('div', { className: 'text-center' },
        React.createElement('div', { className: 'text-5xl mb-4' }, '🧹'),
        React.createElement('p', { className: 'text-gray-400' }, 'Cargando...')
      )
    )

    if (!session)  return React.createElement(LoginPage)
    if (!profile)  return React.createElement(Spinner)

    if (profile.role === 'admin')  return React.createElement(AdminApp,  { profile })
    if (profile.role === 'vendor') return React.createElement(VendorApp, { profile })
    return React.createElement(ClientApp, { profile })
  }

  createRoot(document.getElementById('root')).render(React.createElement(App))
</script>
</body>
</html>
